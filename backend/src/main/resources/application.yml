server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://172.23.86.146:3306/kkmall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

kkmall:
  auth:
    secret: ${KKMALL_AUTH_SECRET:change-me-in-production}
    token-ttl-seconds: ${KKMALL_TOKEN_TTL_SECONDS:604800}
  mock:
    code: ${KKMALL_MOCK_CODE:123456}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_USER:kkmall}
      secret-key: ${MINIO_PASS:change-me}
      bucket: ${MINIO_BUCKET:kkmall}
      public-base-url: ${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:9000/kkmall}
    local-dir: ${KKMALL_UPLOAD_DIR:uploads}
